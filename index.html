<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/avatar.svg" />
  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    >
  </noscript>
  
  <!-- SEO Utama -->
  <title>Sanjay Singh | Full-Stack Developer</title>
  <meta name="description" content="Portfolio of Sanjay Singh (sanjubana), Full-Stack Developer and B.Tech IT student at JECRC. Turning ideas into intelligent, impactful digital experiences with MERN stack, Python, and Machine Learning." />
  <meta name="keywords" content="Sanjay Singh, sanjubana, Full-Stack Developer, MERN Stack, React Developer, Node.js, JECRC, Jaipur, AI, Machine Learning, KIRSI, PolluSense" />
  <meta name="author" content="Sanjay Singh" />

  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Sanjay Singh | Full-Stack Developer" />
  <meta property="og:description" content="Portfolio of Sanjay Singh (sanjubana) — Full-Stack Developer, MERN, AI & ML." />
  <meta property="og:image" content="/avatar.svg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sanjay Singh | Full-Stack Developer" />
  <meta name="twitter:description" content="Turning ideas into intelligent, impactful digital experiences." />
  <meta name="twitter:image" content="/avatar.svg" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Sanjay Singh",
    "alternateName": "sanjubana",
    "jobTitle": "Full-Stack Developer",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Jaipur",
      "addressRegion": "Rajasthan",
      "addressCountry": "India"
    },
    "alumniOf": "Jaipur Engineering College and Research Centre",
    "sameAs": [
      "https://github.com/sanjubana",
      "https://linkedin.com/in/sanjaysingh20",
      "https://instagram.com/sanjubana_20"
    ]
  }
  </script>
</head>

<body class="bg-[#030014] text-white selection:bg-cyan-500/30 selection:text-cyan-200">
  <!-- Root React -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
