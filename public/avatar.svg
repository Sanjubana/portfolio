<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="50%" stop-color="#120e2e"/>
      <stop offset="100%" stop-color="#030014"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Outer Cyber Rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#cyberGlow)" stroke-width="3" opacity="0.6" stroke-dasharray="15 8"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.3"/>

  <!-- Geometric Grid Accent -->
  <path d="M70,200 L330,200 M200,70 L200,330" stroke="#6366f1" stroke-width="0.8" opacity="0.2"/>

  <!-- Modern Developer Silhouette / Monogram Avatar -->
  <g filter="url(#neonBlur)">
    <!-- Base Body Glow -->
    <path d="M110,320 C110,260 150,230 200,230 C250,230 290,260 290,320 C270,345 235,355 200,355 C165,355 130,345 110,320 Z" 
          fill="url(#accentGrad)" opacity="0.85"/>
    
    <!-- Head -->
    <circle cx="200" cy="165" r="58" fill="url(#cyberGlow)"/>

    <!-- Subtle Tech Visor / Glasses Accent -->
    <rect x="160" y="155" width="80" height="16" rx="8" fill="#030014" opacity="0.8"/>
    <rect x="163" y="158" width="74" height="10" rx="5" fill="#22d3ee" opacity="0.9"/>
  </g>

  <!-- Floating Tech Badges / Monogram "SS" -->
  <text x="200" y="302" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    SANJAY SINGH
  </text>
  <text x="200" y="324" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle" letter-spacing="3">
    FULL-STACK DEVELOPER
  </text>
</svg>
